<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng nhập — Chợ Điện Thoại Cũ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f5f7fa; min-height: 100vh; padding: 20px; }

    .back-btn { display: flex; align-items: center; gap: 6px; color: #3b82f6; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 24px; border: none; background: none; }
    .back-btn:active { opacity: 0.7; }

    .container { max-width: 400px; margin: 0 auto; }
    .logo-box { text-align: center; margin-bottom: 36px; }
    .logo { width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; color: white; margin-bottom: 12px; }
    .app-title { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .app-desc { font-size: 14px; color: #6b7280; }

    .form-card { background: white; border-radius: 20px; padding: 32px 24px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .form-title { font-size: 20px; font-weight: 700; margin-bottom: 28px; color: #111827; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px; }
    input { width: 100%; padding: 15px 16px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 15px; outline: none; transition: border .2s, box-shadow .2s; }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    input.error { border-color: #ef4444; }

    .forgot-wrap { text-align: right; margin-bottom: 24px; }
    .forgot-link { font-size: 14px; color: #3b82f6; text-decoration: none; }
    .forgot-link:active { opacity: 0.7; }

    .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 28px 0 24px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px solid #e5e7eb; }
    .divider-text { font-size: 13px; color: #9ca3af; }
    .link-text { text-align: center; font-size: 14px; color: #6b7280; }
    .link-text a { color: #3b82f6; font-weight: 600; text-decoration: none; }

    .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <button class="back-btn" onclick="history.back()">← Quay lại</button>

    <div class="logo-box">
      <div class="logo">📱</div>
      <h1 class="app-title">Chợ Điện Thoại Cũ</h1>
      <p class="app-desc">Đăng nhập để tiếp tục</p>
    </div>

    <div class="form-card">
      <h2 class="form-title">Đăng nhập tài khoản</h2>
      <div class="error-box" id="errorBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@gmail.com" required>
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Nhập mật khẩu" required>
        </div>

        <div class="forgot-wrap">
          <a href="#" class="forgot-link" id="forgotPass">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">🔐 Đăng nhập</button>
      </form>

      <div class="divider"><span class="divider-text">hoặc</span></div>
      <p class="link-text">Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a></p>
    </div>
  </div>

<!-- Kết nối Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDvfVuaTYGeX5k3wMvAY-BVDi2x69xRtKI",
  authDomain: "cho-dien-thoai-cu.firebaseapp.com",
  projectId: "cho-dien-thoai-cu",
  storageBucket: "cho-dien-thoai-cu.firebasestorage.app",
  messagingSenderId: "462484690943",
  appId: "1:462484690943:web:32bec4d5febc4bd00bf9ca",
  measurementId: "G-FK19SPX0M4"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== XỬ LÝ ĐĂNG NHẬP =====
const loginForm = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    return showError('Vui lòng nhập Email và Mật khẩu!');
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '⏳ Đang đăng nhập...';

  try {
    // 1. Đăng nhập với Firebase Auth
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    const user = userCredential.user;

    // 2. Lấy thông tin từ Firestore
    const userDoc = await db.collection('users').doc(user.uid).get();
    if (!userDoc.exists) throw new Error('Tài khoản không tồn tại!');

    const userData = userDoc.data();

    // 3. Kiểm tra trạng thái duyệt
    if (userData.status === 'pending') {
      throw new Error('⏳ Tài khoản đang chờ duyệt! Vui lòng chờ Admin phê duyệt.');
    }
    if (userData.status === 'rejected') {
      throw new Error('❌ Tài khoản bị từ chối!');
    }
    if (userData.status !== 'approved') {
      throw new Error('Trạng thái tài khoản không hợp lệ!');
    }

    // 4. Đăng nhập thành công
    localStorage.setItem('currentUser', JSON.stringify(userData));
    alert('✅ Đăng nhập thành công!');

    // 5. Chuyển trang
    if (userData.role === 'admin') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'nguoiban.html';
    }

  } catch (err) {
    console.error(err);
    let msg = err.message;
    if (msg.includes('auth/user-not-found') || msg.includes('auth/wrong-password')) {
      msg = '❌ Email hoặc Mật khẩu không đúng!';
    } else if (msg.includes('auth/invalid-email')) {
      msg = '❌ Email không hợp lệ!';
    } else if (msg.includes('auth/network-request-failed')) {
      msg = '❌ Kiểm tra kết nối mạng!';
    }
    showError(msg);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '🔐 Đăng nhập';
  }
});

// Quên mật khẩu
document.getElementById('forgotPass').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = prompt('Nhập Email của bạn:');
  if (!email) return;
  try {
    await auth.sendPasswordResetEmail(email);
    alert('✅ Đã gửi link đặt lại mật khẩu! Kiểm tra Email nhé.');
  } catch (e) {
    alert('❌ Không gửi được! Kiểm tra Email đã đăng ký chưa.');
  }
});
</script>

</body>
</html>
